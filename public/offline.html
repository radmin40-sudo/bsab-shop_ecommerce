<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#1f7a42">
        <title>Offline - BSAB-SHOP</title>
        <style>
            :root { color-scheme: light; font-family: Arial, sans-serif; background: #f7fbf7; color: #173b2a; }
            * { box-sizing: border-box; }
            body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px 18px calc(24px + env(safe-area-inset-bottom)); background: radial-gradient(ellipse at 50% 0%, #e5f5e6 0, #f7fbf7 66%); }
            main { width: min(100%, 390px); text-align: center; }
            img { display: block; width: 112px; height: 112px; margin: 0 auto 22px; }
            h1 { margin: 0; color: #145c3d; font-size: 28px; }
            p { margin: 12px 0 24px; color: #567260; font-size: 15px; line-height: 1.55; }
            button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: #1f7a42; color: white; font-size: 14px; font-weight: 700; cursor: pointer; }
            button:focus-visible { outline: 3px solid #9bd4aa; outline-offset: 3px; }
        </style>
    </head>
    <body>
        <main>
            <img src="/pwa-icon-192.png" alt="BSAB-SHOP">
            <h1>You’re offline</h1>
            <p>BSAB-SHOP needs an internet connection to show current products, account details, and orders.</p>
            <button type="button" onclick="window.location.reload()">Try Again</button>
        </main>
    </body>
</html>
